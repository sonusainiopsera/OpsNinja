<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{subject}}</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px;">
  <table width="600" cellpadding="0" cellspacing="0" style="margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
    <tr>
      <td>
        <h1 style="color: #1a1a1a; font-size: 20px; margin: 0 0 16px;">{{subject}}</h1>
        <p style="color: #444; font-size: 15px; line-height: 1.6;">
          You have a new notification from <strong>{{tenantName}}</strong>.
        </p>
        {{#if ticketId}}
        <p style="color: #444; font-size: 15px;">
          Reference: <strong>{{ticketId}}</strong>
        </p>
        {{/if}}
        <p style="margin-top: 24px;">
          <a href="{{portalUrl}}"
             style="background: #2563eb; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-size: 15px;">
            View in portal
          </a>
        </p>
        <p style="color: #888; font-size: 12px; margin-top: 32px;">
          &copy; {{year}} {{tenantName}}. All rights reserved.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
