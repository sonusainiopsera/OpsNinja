# Realtime streaming pipeline SLO definitions — WO-071 AC5
#
# Three named SLIs with committed SLO targets and error-budget windows.
# Each SLI has an explicit numerator and denominator metric expression.
#
# SLI reference → alert mapping:
#   dashboard_freshness    → RealtimeNoFramesPublished (realtime.rules.yaml)
#   stream_availability    → RealtimeGatewayReadinessDegraded, RealtimeSnapshotSourceDatabaseHigh
#   aggregate_correctness  → RealtimeAggregateDriftHigh, RealtimeDlqNonEmpty
#
# Metric sources:
#   realtime_frames_delivered_total    — gateway.metrics.ts
#   realtime_connections_active        — gateway.metrics.ts
#   realtime_snapshot_required_total   — gateway.metrics.ts
#   dashboard_aggregate_drift          — pipeline.metrics.ts
#   dashboard_reconcile_cycles_total   — pipeline.metrics.ts

slos:

  # ── SLI 1: Dashboard Freshness ─────────────────────────────────────────────
  # The p95 age of the newest delivered frame, measured from generatedAt to
  # socket sentAt, must be under 10 seconds.
  #
  # Good event: realtime_frame_delivery_seconds observation <= 10s
  # Bad event:  realtime_frame_delivery_seconds observation > 10s
  - name: dashboard_freshness
    description: >
      p95 latency from frame generation to delivery at the client WebSocket
      must be under 10 seconds. A stale dashboard looks like a quiet system —
      the worst failure mode for an on-call command centre.
    slo_target_pct: 99.0
    error_budget_window: 30d
    sli:
      numerator: >
        sum(rate(realtime_frame_delivery_seconds_bucket{le="10"}[5m]))
      denominator: >
        sum(rate(realtime_frame_delivery_seconds_count[5m]))
    alert_expression: >
      histogram_quantile(0.95, rate(realtime_frame_delivery_seconds_bucket[5m])) > 10
    alert_for: 1m
    alert_severity: critical

  # ── SLI 2: Stream Availability ─────────────────────────────────────────────
  # The share of agent sessions in live WebSocket state (not falling back to
  # polling) must be above 99%. When the gateway is degraded, clients fall back
  # to snapshot polling — still functional but higher latency and database load.
  #
  # Good event: a socket remains in live state for a scrape interval
  # Bad event:  realtime_snapshot_required_total{reason="reconnect"} increment
  #             (client had to fall back to snapshot due to connection loss)
  - name: stream_availability
    description: >
      At least 99% of agent WebSocket sessions must be in live push state.
      Sessions in polling/snapshot fallback state are counted as unavailable
      because agents experience higher latency and the database bears snapshot load.
    slo_target_pct: 99.0
    error_budget_window: 30d
    sli:
      numerator: >
        sum(realtime_connections_active)
        - sum(increase(realtime_snapshot_required_total{reason="reconnect"}[5m]))
      denominator: >
        sum(realtime_connections_active)
    alert_expression: >
      (
        sum(realtime_connections_active) > 0
      )
      and
      (
        (
          sum(realtime_connections_active)
          - sum(increase(realtime_snapshot_required_total{reason="reconnect"}[5m]))
        )
        /
        sum(realtime_connections_active)
      ) < 0.99
    alert_for: 5m
    alert_severity: warning

  # ── SLI 3: Aggregate Correctness ───────────────────────────────────────────
  # The share of reconciliation cycles reporting zero drift across all counters
  # must be above 99.9%. Non-zero drift means agents see incorrect KPI counts.
  #
  # Good cycle: reconcile completes with max(dashboard_aggregate_drift) == 0
  # Bad cycle:  reconcile completes with max(dashboard_aggregate_drift) > 0
  - name: aggregate_correctness
    description: >
      At least 99.9% of 60-second reconciliation cycles must complete with zero
      drift between Redis aggregates and the authoritative Postgres values.
      Persistent drift means agents see incorrect open-ticket counts and SLA
      indicators that do not match the database of record.
    slo_target_pct: 99.9
    error_budget_window: 30d
    sli:
      numerator: >
        sum(increase(dashboard_reconcile_cycles_total{outcome="success"}[5m]))
        - sum(increase(dashboard_reconcile_cycles_total{outcome="success"}[5m]) and
          dashboard_aggregate_drift > 0)
      denominator: >
        sum(increase(dashboard_reconcile_cycles_total[5m]))
    alert_expression: >
      max(dashboard_aggregate_drift) > 50
    alert_for: 2m
    alert_severity: warning

# ── Error-budget burn rate windows ─────────────────────────────────────────
# Fast-burn (1h window) for critical failures, slow-burn (6h) for sustained
# degradation. Configured in the alerting rules via for-duration.
burn_rate_windows:
  fast_burn:
    window: 1h
    multiplier: 14.4   # burns 2% of 30-day budget in 1h
  slow_burn:
    window: 6h
    multiplier: 6.0    # burns 5% of 30-day budget in 6h
