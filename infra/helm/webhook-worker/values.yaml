replicaCount: 1

image:
  repository: opsninja/webhook-worker
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  annotations:
    # IRSA: inject web identity token for SQS and KMS access.
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/webhook-worker"

env:
  AWS_REGION: us-east-1
  HEALTH_PORT: "3002"
  # WEBHOOK_SQS_QUEUE_URL, DATABASE_URL, REDIS_URL, KMS_WEBHOOK_KEY_ARN injected via Secrets Manager / environment.

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 3002
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: 3002
  initialDelaySeconds: 5
  periodSeconds: 10

# ── KEDA ScaledObject ─────────────────────────────────────────────────────────
# Scale webhook-worker based on SQS queue depth.
# Minimum 1 replica keeps the worker active; KEDA scales out as queue grows.
# Target: ~10 messages in-flight per replica at steady state.
keda:
  enabled: true
  scaledObject:
    minReplicaCount: 1
    maxReplicaCount: 20
    pollingInterval: 15
    cooldownPeriod: 120
    triggers:
      - type: aws-sqs-queue
        metadata:
          queueURL: "$(WEBHOOK_SQS_QUEUE_URL)"
          queueLength: "10"
          awsRegion: us-east-1
          identityOwner: operator

# ── DLQ CloudWatch Alarm ──────────────────────────────────────────────────────
# Fires when any message arrives in the webhook delivery dead-letter queue.
# A single DLQ message indicates a webhook that failed all 6 delivery attempts.
cloudwatchAlarms:
  dlq:
    enabled: true
    alarmName: "webhook-worker-dlq-not-empty"
    alarmDescription: "One or more webhook deliveries reached the DLQ after 6 attempts"
    # ApproximateNumberOfMessagesVisible >= 1 for 1 evaluation period (1 minute).
    metricName: ApproximateNumberOfMessagesVisible
    namespace: AWS/SQS
    statistic: Sum
    period: 60
    evaluationPeriods: 1
    threshold: 1
    comparisonOperator: GreaterThanOrEqualToThreshold
    treatMissingData: notBreaching
    # SNS ARN for P2 on-call alert.
    alarmActions:
      - "arn:aws:sns:us-east-1:ACCOUNT_ID:opsninja-p2-alerts"
    dimensions:
      QueueName: "opsninja-webhook-dlq"

# ── SLI Definitions ───────────────────────────────────────────────────────────
# Service-level indicators for webhook delivery reliability and latency.
# These feed the SLO dashboards in Grafana/CloudWatch.
sli:
  delivery:
    # Percentage of webhook deliveries that succeed (delivered) vs total dispatched
    successRateTarget: 0.99
    # P99 end-to-end delivery latency from SQS receive to HTTP response
    p99LatencyMs: 10000
    # Auto-disable triggers an incident if > 5 endpoints are disabled per hour
    autoDisablePerHourThreshold: 5
  worker:
    # SQS message age: alert if oldest message age exceeds 5 minutes (300s)
    oldestMessageAgeAlertSeconds: 300
    # DLQ depth: any non-zero depth triggers P2 alert (see cloudwatchAlarms above)
    dlqDepthAlertThreshold: 1
